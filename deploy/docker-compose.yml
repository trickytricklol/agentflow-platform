services:
  agentflow-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTFLOW_AUTH_ENABLED: "0"
      AGENTFLOW_HOST: "0.0.0.0"
      AGENTFLOW_DATA_DIR: "/app/data"
    volumes:
      - agentflow-data:/app/data
volumes:
  agentflow-data:
